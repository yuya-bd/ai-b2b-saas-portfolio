name: Test

on:
  # No paths filter on push: the badge in the README should always reflect the
  # current state of main, not the last run that happened to touch app code.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'src/**'
      - 'lib/**'
      - 'db/**'
      - 'proxy.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saas_foundation_test
      BETTER_AUTH_SECRET: test-secret-key-for-testing-only-32-chars-min
      APP_SLUG: saas-foundation
      USE_MOCK_SQS: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_foundation
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE saas_foundation_test;'

      # CI starts from an empty database every run, so pushing the schema is
      # both faster and sufficient. Local databases use db:migrate instead, so
      # the migration files stay the source of truth there.
      - name: Push schema to test database
        run: npx drizzle-kit push --force

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Run production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run full test suite
        run: pnpm test:run
