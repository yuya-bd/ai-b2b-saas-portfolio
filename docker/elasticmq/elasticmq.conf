include classpath("application.conf")

# Ports match the host-side mapping in docker-compose.yml so the queue URLs
# ElasticMQ hands back are reachable from the host unchanged.
node-address {
  protocol = http
  host = "*"
  port = 9326
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9326
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9327
  bind-hostname = "0.0.0.0"
}

queues {
  "job-queue" {
    # Matches the worker's processing budget.
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    # Long polling.
    receiveMessageWait = 20 seconds
    fifo = false
    contentBasedDeduplication = false
  }
}
